name: Publish staging
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/deploy-staging
permissions:
  contents: read
concurrency:
  group: staging-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Configure initial Git branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run check
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v6
      - name: Build Google staging
        run: npm run build:staging && npm run check:bundle
        env:
          VITE_APP_ENV: staging
          VITE_API_MODE: apps-script
          VITE_API_URL: ${{ vars.STAGING_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.STAGING_GOOGLE_CLIENT_ID }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish staging artifact
        id: deployment
        uses: actions/deploy-pages@v5
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STAGING_URL: ${{ needs.deploy.outputs.page_url }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
    steps:
      - name: Configure initial Git branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check published HTML, entry asset and backend health
        run: node scripts/check-published-page.mjs
