name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Fast quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure initial Git branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checks-and-builds
          path: |
            coverage/
            apps/web/dist/
            apps/apps-script/dist/
          retention-days: 7
